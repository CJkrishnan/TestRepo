namespace: default

replicaCount: 3

image:
  repository: nginx
  tag: stable
  pullPolicy: IfNotPresent

strategy:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }
      - setWeight: 20
      - pause: {}

service:
  port: 80

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
