apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "argorollout-chart.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "argorollout-chart.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "argorollout-chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "argorollout-chart.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 30
        - setWeight: 20
        - pause: {}
        - setWeight: 50
        - pause:
            duration: 10
